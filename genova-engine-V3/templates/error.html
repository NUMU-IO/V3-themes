<!-- Genova (V3) — static BYOT error state.
     Renders before the bundle exists, so every value is a literal matching the
     theme's shipped defaults. Note the failure is signalled by an icon-free
     heading and a hairline card, NOT by red. Genova does use red now, but only
     for DISCOUNTS — spending the commerce colour on a failure would both dilute
     it and encode meaning in colour alone (WCAG 1.4.1).

     Bilingual without script. The host stamps `dir` on <html> before this is
     injected, so an ancestor selector is enough to pick a language. English is
     the DEFAULT (visible with no `dir` at all) and Arabic replaces it only
     under `[dir="rtl"]` — so an unstyled or unknown-direction document still
     shows exactly one readable message rather than both or neither.
     A style block, not inline styles, because inline cannot express an
     ancestor condition. No script: the theme contract forbids it, and an
     error page that depends on JS is the one page that must not.

     The charset declaration is insurance: served as a bare text/html fragment
     with no charset, a browser decodes it as windows-1252 and the Arabic
     mojibakes. -->
<meta charset="utf-8" />
<style>
  .gn-err-ar { display: none; }
  [dir="rtl"] .gn-err-en { display: none; }
  /* `revert`, not `block`: the class is on both <span>s and <div>s here, and
     forcing block would turn the inline label and button text into blocks. */
  [dir="rtl"] .gn-err-ar { display: revert; }
</style>
<main
  role="alert"
  style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:#f5f4f2;font-family:'Instrument Sans',Manrope,system-ui,sans-serif;color:#141414"
>
  <div style="text-align:center;max-width:26rem;border:1px solid #e2e0dc;background:#ffffff;padding:2.5rem 2rem">
    <p style="font-size:.6875rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b6b6b;margin:0">
      <span class="gn-err-en">Error</span>
      <span class="gn-err-ar" lang="ar">خطأ</span>
    </p>

    <div class="gn-err-en">
      <h1 style="font-size:1.375rem;font-weight:500;letter-spacing:-.01em;line-height:1.2;margin:.75rem 0 0">
        This page didn’t load
      </h1>
      <p style="font-size:.9375rem;line-height:1.6;color:#6b6b6b;margin:.75rem 0 0">
        Something went wrong on our side. Try again in a moment.
      </p>
    </div>

    <div class="gn-err-ar" lang="ar">
      <h1 style="font-size:1.375rem;font-weight:500;letter-spacing:-.01em;line-height:1.2;margin:.75rem 0 0">
        الصفحة دي مش عايزة تفتح
      </h1>
      <p style="font-size:.9375rem;line-height:1.6;color:#6b6b6b;margin:.75rem 0 0">
        في مشكلة عندنا. جرّب تاني بعد شوية.
      </p>
    </div>

    <button
      data-numu-reset
      type="button"
      style="margin-top:1.75rem;min-height:50px;padding:0 1.75rem;background:#111111;color:#ffffff;border:0;border-radius:999px;font:inherit;font-size:.8125rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer"
    >
      <span class="gn-err-en">Try again</span>
      <span class="gn-err-ar" lang="ar">جرّب تاني</span>
    </button>
  </div>
</main>
